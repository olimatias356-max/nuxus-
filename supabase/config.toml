# Supabase CLI configuration for local development (`npx supabase start`).
# Hosted projects: mirror the [auth] settings in Dashboard → Authentication.
project_id = "mbaretefans"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "mbaretefans://"
additional_redirect_urls = ["mbaretefans://**", "exp://**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_refresh = 150
token_verifications = 30

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 6
otp_expiry = 3600

[auth.email.template.confirmation]
subject = "Tu código de MbareteFans"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Recuperá tu cuenta de MbareteFans"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirmá tu nuevo email en MbareteFans"
content_path = "./supabase/templates/email_change.html"

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

[functions.delete-account]
verify_jwt = true

[functions.push-dispatch]
verify_jwt = false

[functions.payout-webhook]
verify_jwt = false

# Public: Google calls it; trust comes from the ECDSA signature checked inside.
[functions.admob-ssv]
verify_jwt = false

# Service role only (checked inside the function).
[functions.admob-import]
verify_jwt = false

# Service role only (checked inside the function).
[functions.dlocal-payouts]
verify_jwt = false
